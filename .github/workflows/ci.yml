name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["5.1.1", "5.5.0"]

    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-doc
      - name: Check package metadata
        run: opam lint streaming-statistics.opam
      - name: Build source and install tested package
        run: |
          opam exec -- dune build @all @doc
          opam install . --with-test --with-doc
      - name: Run examples against the installed package
        run: |
          example_dir="$(mktemp -d)"
          cp examples/basic.ml examples/quantiles.ml "$example_dir/"
          cd "$example_dir"
          opam exec -- ocamlfind ocamlopt -package streaming-statistics \
            -linkpkg basic.ml -o basic.exe
          opam exec -- ocamlfind ocamlopt -package streaming-statistics \
            -linkpkg quantiles.ml -o quantiles.exe
          ./basic.exe
          ./quantiles.exe
